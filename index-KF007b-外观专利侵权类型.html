    var re = new RegExp('(' + sorted.map(function (h) {
      return h.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

        '<div class="pager"><span class="num">&lt;</span><span class="num active">1</span><span class="num">2</span><span class="num">3</span><span class="num">4</span><span class="num">5</span><span class="num">6</span><span class="num">...</span><span class="num">554</span><span class="num">&gt;</span></div>' +
        '<span class="info">前往</span><input class="el-input" style="width:48px;height:24px;padding:0 4px;text-align:center" value="1"><span class="info">页</span>' +
      '</div></div></div>';
  }

  function riskLevel(score, hit) {
    if (!hit) return { key: 'none', label: '暂无风险' };
    return { key: 'high', label: '存在风险' };
  }

  function cmpFrame(url, boxes, emptyText) {
    if (!url) {
      return '<div class="frame"><div class="ph" style="color:#c0c4cc;font-size:12px;padding:8px;text-align:center">' + (emptyText || '—') + '</div></div>';
    }
    var boxHtml = (boxes || []).map(function (b) {
      return '<div class="box" style="left:' + b.l + '%;top:' + b.t + '%;width:' + b.w + '%;height:' + b.h + '%"></div>';
    }).join('');
    return '<div class="frame" data-act="previewPatentImg" data-src="' + url + '" title="点击放大">' +
      '<img src="' + url + '" alt="">' + boxHtml + '</div>';
  }

  /** 由现网小类名推断证据形态 */
  function inferHitKind(name) {
    var n = name || '';
    if (n.indexOf('品牌字段') >= 0) return 'brand';
    if (n.indexOf('图片商标') >= 0) return 'img_mark';
    if (n.indexOf('图片版权') >= 0 || n.indexOf('图片产品') >= 0) return 'img_product';
    if (n.indexOf('外观') >= 0) return 'dp';
    if (n.indexOf('标题') >= 0) return 'title';
    if (n.indexOf('描述') >= 0) return 'desc';
    return 'text';
  }

  function normalizeHitRows(rows, d, type) {
    var opp = (d.oppImgs && d.oppImgs[0]) || d.oppMainImg || '';
    return (rows || []).map(function (r) {
      var name = r.name || '';
      var kind = r.kind || inferHitKind(name);
      var row = {
        name: name,
        score: r.score,
        kind: kind,
        highlight: r.highlight || d.hits || [],
        text: r.text || '',
        refText: r.refText || '',
        oppImg: r.oppImg || '',
        refImg: r.refImg || '',
        boxes: r.boxes || [],
        pairs: r.pairs || []
      };
      if (kind === 'brand' && !row.text) row.text = d.brand || '—';
      if (kind === 'title' && !row.text) row.text = d.title || '—';
      if (kind === 'desc' && !row.text) row.text = d.desc || '—';
      if (type === 'cp' && kind === 'title' && !row.refText) row.refText = d.ourTitle || '';
      if (type === 'cp' && kind === 'desc' && !row.refText) row.refText = d.ourDesc || '';
      if (kind === 'img_mark') {
        if (!row.pairs.length) {
          row.pairs = [{
            score: row.score,
            oppImg: row.oppImg || opp,
            boxes: row.boxes.length ? row.boxes : [{ l: 8, t: 12, w: 28, h: 14 }]
          }];
        }
      }
      if (kind === 'img_product') {
        if (!row.pairs.length) {
          row.pairs = [{
            score: row.score,
            oppImg: row.oppImg || opp,
            refImg: row.refImg || d.cpRefImg || '',
            boxes: row.boxes.length ? row.boxes : [{ l: 15, t: 18, w: 50, h: 45 }]
          }];
        }
      }
      return row;
    });
  }

  /** 三块常驻；每个命中点单独证据：文案高亮 / 仅卖家图 / 卖家vs我方 */
  function buildCompareBlocks(d) {
    var hd = d.hitDetail || { tm: [], cp: [] };
    var patent = d.patentId ? findPatent(d.patentId) : null;
    var pImg = patent && patent.imgs && patent.imgs[0] ? patent.imgs[0].url : '';
    var opp = (d.oppImgs && d.oppImgs[0]) || d.oppMainImg || '';
    var tmRows = normalizeHitRows(hd.tm, d, 'tm');
    var cpRows = normalizeHitRows(hd.cp, d, 'cp');
    var tmHit = !!(d.tm || tmRows.length);
    var cpHit = !!(d.cp || cpRows.length);
    var dpHit = !!d.dp;
    var tmScore = d.tmSim != null ? d.tmSim : d.imgSim;
    var cpScore = d.cpSim != null ? d.cpSim : d.descSim;

    if (tmHit && !tmRows.length) {
      tmRows = normalizeHitRows([{ name: '标题商标命中', score: tmScore }], d, 'tm');
    }
    if (cpHit && !cpRows.length) {
      cpRows = normalizeHitRows([{ name: '描述版权命中', score: cpScore }], d, 'cp');
    }

    var dpRows = [];
    if (dpHit) {
      var pairs = d.dpPairs || [];
      if (!pairs.length) {
        pairs = [{
          score: d.dpSim,
          oppImg: d.oppMainImg || opp,
          refImg: pImg,
          boxes: [{ l: 18, t: 12, w: 64, h: 72 }],
          tip: ''
        }];
      } else {
        pairs = pairs.map(function (pair) {
          return {
            score: pair.score != null ? pair.score : d.dpSim,
            oppImg: pair.oppImg || d.oppMainImg || opp,
            refImg: pair.refImg || pImg,
            boxes: pair.boxes || [{ l: 18, t: 12, w: 64, h: 72 }],
            tip: pair.tip || ''
          };
        });
      }
      dpRows = [{
        name: '外观专利命中',
        score: d.dpSim,
        kind: 'dp',
        pairs: pairs
      }];
    }

    return [
      { type: 'tm', title: '商标侵权风险', score: tmHit ? tmScore : null, hit: tmHit, points: tmRows },
      { type: 'cp', title: '版权侵权风险', score: cpHit ? cpScore : null, hit: cpHit, points: cpRows },
      { type: 'dp', title: '外观专利侵权风险', score: dpHit ? d.dpSim : null, hit: dpHit, points: dpRows }
    ];
  }

  function textCompareHtml(oppText, refText, highlight) {
    return (
      '<div class="hp-text-cmp">' +
        '<div class="side"><div class="lab">卖家</div><div class="hp-text">' + highlightHtml(oppText || '—', highlight) + '</div></div>' +
        '<div class="mid">VS</div>' +
        '<div class="side"><div class="lab">我方</div><div class="hp-text">' + (refText ? highlightHtml(refText, highlight) : '—') + '</div></div>' +
      '</div>'
    );
  }

  function imgPairHtml(pair, mode) {
    var scoreLine = (pair.score != null && pair.score !== '')
      ? '<div class="pair-score">本组相似度: ' + pair.score + '%</div>'
      : '';
    var tipLine = pair.tip
      ? '<div class="pair-tip">' + pair.tip + '</div>'
      : '';
    if (mode === 'solo') {
      return (
        '<div class="hp-img-pair">' + scoreLine +
          '<div class="hp-imgs solo"><div class="side"><div class="lab" style="font-size:12px;color:#909399;margin-bottom:4px">卖家</div>' +
            cmpFrame(pair.oppImg, pair.boxes, '暂无图片') +
          '</div></div>' + tipLine +
        '</div>'
      );
    }
    return (
      '<div class="hp-img-pair">' + scoreLine +
        '<div class="hp-imgs">' +
          '<div class="side"><div class="lab" style="font-size:12px;color:#909399;margin-bottom:4px">卖家</div>' + cmpFrame(pair.oppImg, pair.boxes, '暂无图片') + '</div>' +
          '<div class="mid">VS</div>' +
          '<div class="side"><div class="lab" style="font-size:12px;color:#909399;margin-bottom:4px">我方</div>' + cmpFrame(pair.refImg, [], '—') + '</div>' +
        '</div>' + tipLine +
      '</div>'
    );
  }

  function imgStackHtml(pairs, mode) {
    var list = pairs || [];
    if (!list.length) return '<div class="cmp-empty-body">—</div>';
    return '<div class="hp-img-stack">' + list.map(function (pair) {
      return imgPairHtml(pair, mode);
    }).join('') + '</div>';
  }

  function hitPointEvidenceHtml(p, type) {
    var kind = p.kind;
    var score = (p.score != null && p.score !== '') ? ('<span class="hp-score">' + p.score + '%</span>') : '';
    var left = '<div class="hp-left"><span class="hp-name">' + p.name + '</span>' + score + '</div>';
    var right = '';

    if (type === 'cp' && (kind === 'title' || kind === 'desc')) {
      right = textCompareHtml(p.text, p.refText, p.highlight);
    } else if (kind === 'brand' || kind === 'title' || kind === 'desc' || kind === 'text') {
      right = '<div class="hp-text">' + highlightHtml(p.text || '—', p.highlight) + '</div>';
    } else if (kind === 'img_mark') {
      right = imgStackHtml(p.pairs, 'solo');
    } else if (kind === 'img_product' || kind === 'dp') {
      right = imgStackHtml(p.pairs, 'vs');
    }
    return '<div class="hit-point">' + left + '<div class="hp-right">' + right + '</div></div>';
  }

  function compareCardHtml(block) {
    var lv = riskLevel(block.score, block.hit);
    var bodyInner;
    if (!block.hit) {
      bodyInner = '<div class="cmp-empty-body">暂无风险</div>';
    } else {
      var points = (block.points || []).map(function (p) {
        return hitPointEvidenceHtml(p, block.type);
      }).filter(Boolean).join('');
      bodyInner =
        '<div class="hit-points">' + (points || '<div class="cmp-empty-body">—</div>') + '</div>';
    }
    return (
      '<div class="cmp-card ' + block.type + (block.hit ? '' : ' is-empty') + '">' +
        '<div class="cmp-hd"><span class="title">' + block.title + '</span><span class="cmp-level ' + lv.key + '">' + lv.label + '</span></div>' +
        '<div class="cmp-body">' + bodyInner + '</div>' +
      '</div>'
    );
  }

  function summaryGridHtml(d) {
    var tmCnt = d.tmCount != null ? d.tmCount : (d.tm ? Number(d.tm) || 1 : 0);
    var cpCnt = d.cpCount != null ? d.cpCount : (d.cp ? Number(d.cp) || 1 : 0);
    var dpCnt = d.dp ? (Number(d.dpDetail || d.dp) || 1) : 0;
    return (
      '<div class="status-grid status-grid-slim">' +
        '<div><p>商标侵权</p><p>' + (tmCnt ? tmCnt : '—') + '</p></div>' +
        '<div><p>版权侵权</p><p>' + (cpCnt ? cpCnt : '—') + '</p></div>' +
        '<div><p>外观专利侵权</p><p>' + (dpCnt ? dpCnt : '—') + '</p></div>' +
      '</div>'
    );
  }

  function detailMediaHtml(d) {
    var blocks = buildCompareBlocks(d);
    return '<div class="compare-stack">' + blocks.map(compareCardHtml).join('') + '</div>';
  }

  function saleTagHtml(status) {
    // 0 不在售 / 1 在售 / 2 已删除
    if (status === 0) return '<span class="tag-sale" style="background:#fef0f0;color:#f56c6c;border-color:#f56c6c;width:auto;padding:0 4px">不在售</span>';
    if (status === 2) return '<span class="tag-sale" style="background:#fef0f0;color:#c45656;border-color:#c45656;width:auto;padding:0 4px">已删除</span>';
    return '<span class="tag-sale">在售</span>';
  }

  function similarProductsBlock(d) {
    var rows = d.simList || [];
    var body;
    if (!rows.length) {
      body = '<tr><td colspan="5" style="color:#c0c4cc;text-align:center;padding:16px">暂无相似产品</td></tr>';
    } else {
      body = rows.map(function (s) {
        var site = s.site || d.site || '—';
        var shop = s.shop || (site === 'US' ? 'Govee_US' : site);
        var asin = s.asin || d.asin || '—';
        var msku = s.msku || s.sku || '—';
        var line = s.line || s.productLine || '—';
        var pos = s.pos || s.position || '—';
        var price = s.price != null ? ((s.currency || d.currency || '$') + s.price) : '—';
        var upd = s.updateTime || d.uTime || '—';
        var risk = s.low ? '<span class="low-risk">低价风险</span>' : '—';
        return '<tr><td><div class="sim-prod">' +
          '<div class="sim-thumb">图</div>' +
          '<div class="sim-meta">' + saleTagHtml(s.status == null ? 1 : s.status) +
            '<span class="line">' + shop + '</span>' +
            '<span class="line word-blue">' + asin + '</span>' +
            '<span class="line word-blue">' + msku + '</span>' +
          '</div></div></td>' +
          '<td><div style="font-size:12px;line-height:1.5">' + line + '<br>' + pos + '</div></td>' +
          '<td>' + price + '</td>' +
          '<td>' + risk + '</td>' +
          '<td style="font-size:12px;color:#606266">' + upd + '</td></tr>';
      }).join('');
    }
    return '<div class="block"><h3>关联相似产品</h3><div class="sim-scroll"><table class="mini-table"><thead><tr>' +
      '<th>产品信息</th><th>产品线，定位</th><th>价格</th><th>风险</th><th>更新时间</th>' +
      '</tr></thead><tbody>' + body + '</tbody></table></div></div>';
  }

  function histNum(v, clickable) {
    if (v == null || v === '' || v === 0) return '<span class="n na">—</span>';
    return '<span class="n' + (clickable ? '' : '') + '">' + v + '</span>';
  }

  /** 卖家历史可点；产品历史只读（对齐现网） */
  function historyCaseBlock(title, name, stats, clickable) {
    stats = stats || {};
    var total = stats.riskNum != null ? stats.riskNum : 0;
    var cells = [
      { lab: '待确定', key: 'waitConfirmed', v: stats.waitConfirmed },
      { lab: '待投诉', key: 'waitComplained', v: stats.waitComplained },
      { lab: '投诉中', key: 'complaining', v: stats.complaining },
      { lab: '投诉成功', key: 'success', v: stats.success },
      { lab: '投诉驳回', key: 'rejected', v: stats.rejected },
      { lab: '已关闭', key: 'closed', v: stats.closed, mute: true }
    ];
    var grid = cells.map(function (c) {
      var n = (c.v == null || c.v === 0) ? '<span class="n na">—</span>' : ('<span class="n' + (c.mute ? ' muted' : '') + '">' + c.v + '</span>');
      var cls = 'hist-cell' + (clickable && c.v ? ' clickable' : '');
      return '<div class="' + cls + '"><span class="lab">' + c.lab + '</span>' + n + '</div>';
    }).join('');
    return '<div class="block"><h3>' + title + '</h3>' +
      '<div class="hist-name">' + (name || '—') + '</div>' +
      '<div class="hist-total">风控数: <span class="n">' + total + '</span></div>' +
      '<div class="hist-grid">' + grid + '</div></div>';
  }

  function defaultSellerHist(d) {
    return d.sellerHist || { riskNum: 8, waitConfirmed: 8, waitComplained: 0, complaining: 0, success: 0, rejected: 0, closed: 0 };
  }

  function defaultProductHist(d) {
    return d.productHist || { riskNum: 1, waitConfirmed: 1, waitComplained: 0, complaining: 0, success: 0, rejected: 0, closed: 0 };
  }

    var grid = summaryGridHtml(d);

    return '<div class="detail-page page-flex-colunm"><div class="detail-body">' +

      '<div class="flex-layout"><div><span class="box-text bgc-text">' + d.site + '</span> <span class="box-text platform-text">' + d.platform + '</span> <span class="word-blue">' + d.code + '</span></div>' +

  function srEsc(s) {
    return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function srListingLow(d) {
    return (d.simList || []).some(function (x) { return x.low; }) ? 1 : 0;
  }
  function srHitType(r) {
    var p = [];
    if (r.tm || r.tmCount) p.push('商标');
    if (r.cp || r.cpCount) p.push('版权');
    if (r.dp || r.dpDetail) p.push('外观');
    return p.length ? p.join('/') : '—';
  }
  function srSellerKey(p, site, seller) { return p + '||' + site + '||' + seller; }
  function buildRiskSellers() {
    var map = {};
    listings.forEach(function (r) {
      if (r.status > 2) return;
      var key = srSellerKey(r.platform, r.site, r.seller);
      if (!map[key]) {
        map[key] = { key:key, platform:r.platform, site:r.site, seller:r.seller, active:0, s0:0, s1:0, s2:0, tm:0, cp:0, dp:0, low:0, skus:{}, latest:'', listings:[] };
      }
      var s = map[key];
      s.active += 1;
      s['s' + r.status] += 1;
      s.tm += r.tmCount || r.tm || 0;
      s.cp += r.cpCount || r.cp || 0;
      s.dp += r.dp || Number(r.dpDetail) || 0;
      s.low += srListingLow(r);
      if (r.sku) s.skus[r.sku] = (s.skus[r.sku] || 0) + 1;
      var t = r.uTime || r.cTime;
      if (!s.latest || t > s.latest) s.latest = t;
      s.listings.push(r);
    });
    return Object.keys(map).map(function (k) {
      var s = map[k];
      s.skuCnt = Object.keys(s.skus).length;
      s.hitCnt = (s.tm || 0) + (s.cp || 0) + (s.dp || 0);
      s.listings.sort(function (a, b) { return (a.uTime || a.cTime) < (b.uTime || b.cTime) ? 1 : -1; });
      return s;
    });
  }
  function filteredRiskSellers() {
    var rows = buildRiskSellers().filter(function (s) {
      if (state.srSite && s.site !== state.srSite) return false;
      if (state.srPlatform && s.platform !== state.srPlatform) return false;
      if (state.srSeller && s.seller.toLowerCase().indexOf(state.srSeller.toLowerCase()) < 0) return false;
      var day = (s.latest || '').slice(0, 10);
      if (state.srFrom && day < state.srFrom) return false;
      if (state.srTo && day > state.srTo) return false;
      return true;
    });
    var key = state.srSortKey;
    var dir = state.srSortDir === 'asc' ? 1 : -1;
    rows.sort(function (a, b) {
      var va = a[key] || 0, vb = b[key] || 0;
      if (va === vb) return b.active - a.active;
      return va < vb ? -dir : dir;
    });
    return rows;
  }
  function readSrFilters() {
    var a = document.getElementById('srSite');
    if (!a) return;
    state.srSite = a.value;
    state.srPlatform = document.getElementById('srPlatform').value;
    state.srSeller = document.getElementById('srSeller').value.trim();
    state.srFrom = document.getElementById('srFrom').value;
    state.srTo = document.getElementById('srTo').value;
  }
  function pageSellerRisk() {
    var rows = filteredRiskSellers();
    var total = rows.length;
    var maxPage = Math.max(1, Math.ceil(total / state.srPageSize));
    if (state.srPage > maxPage) state.srPage = maxPage;
    var start = (state.srPage - 1) * state.srPageSize;
    var pageRows = rows.slice(start, start + state.srPageSize);
    if (state.srDrawer && state.srKey && !rows.some(function (r) { return r.key === state.srKey; })) {
      state.srDrawer = false; state.srKey = '';
    }
    var selected = (state.srDrawer && state.srKey) ? rows.find(function (s) { return s.key === state.srKey; }) : null;
    var sites = [], plats = [];
    buildRiskSellers().forEach(function (s) {
      if (sites.indexOf(s.site) < 0) sites.push(s.site);
      if (plats.indexOf(s.platform) < 0) plats.push(s.platform);
    });
    var sellerCnt = rows.length, activeN = 0, lowN = 0, skuMap = {};
    rows.forEach(function (s) {
      activeN += s.active; lowN += s.low;
      Object.keys(s.skus).forEach(function (sku) { skuMap[sku] = 1; });
    });
    function sortTh(key, label) {
      var on = state.srSortKey === key;
      return '<th class="sr-sort' + (on ? ' is-on' : '') + '" data-act="srSort" data-key="' + key + '">' + label +
        '<span class="arr">' + (on ? (state.srSortDir === 'asc' ? '▲' : '▼') : '↕') + '</span></th>';
    }
    var body = pageRows.map(function (s) {
      return '<tr class="' + (state.srDrawer && s.key === state.srKey ? 'active' : '') + '">' +
        '<td>' + srEsc(s.seller) + '</td><td>' + srEsc(s.site) + '</td><td>' + srEsc(s.platform) + '</td>' +
        '<td><b>' + s.active + '</b></td><td>' + s.skuCnt + '</td><td>' + s.low + '</td><td>' + s.hitCnt + '</td>' +
        '<td>' + srEsc(s.latest || '') + '</td>' +
        '<td><button class="el-button is-text" data-act="srOpen" data-key="' + srEsc(s.key) + '">查看</button></td></tr>';
    }).join('');
    var drawer = '';
    if (selected) {
      var topL = selected.listings.slice(0, 5).map(function (r) {
        return '<tr><td><a href="javascript:;" data-act="detail" data-id="' + r.id + '">' + srEsc(r.code) + '</a></td><td>' + srEsc(r.title) + '</td><td>' + srHitType(r) + '</td></tr>';
      }).join('');
      var topS = Object.keys(selected.skus).map(function (sku) { return { sku:sku, cnt:selected.skus[sku] }; })
        .sort(function (a, b) { return b.cnt - a.cnt; }).slice(0, 5)
        .map(function (x) { return '<tr><td>' + srEsc(x.sku) + '</td><td>' + x.cnt + '</td></tr>'; }).join('');
      drawer = '<div class="sr-mask" data-act="srClose"></div><aside class="sr-drawer">' +
        '<div class="sr-hd"><div><div class="name">' + srEsc(selected.seller) + '</div>' +
        '<div class="meta">' + srEsc(selected.site) + ' / ' + srEsc(selected.platform) +
        ' · 更新时间 ' + srEsc(selected.latest || '—') + '</div></div>' +
        '<button type="button" class="sr-x" data-act="srClose">×</button></div>' +
        '<div class="sr-bd"><div class="sr-metrics">' +
          '<div class="sr-m"><div class="k">活跃风险 Listing 数</div><div class="n em">' + selected.active + '</div></div>' +
          '<div class="sr-m"><div class="k">涉及 SKU 数</div><div class="n">' + selected.skuCnt + '</div></div>' +
        '</div>' +
        '<div class="sr-sec"><h4>未关闭状态拆分</h4><div class="sr-strip">' +
          '<div class="c"><div class="l">待确认</div><div class="n">' + selected.s0 + '</div></div>' +
          '<div class="c"><div class="l">待投诉</div><div class="n">' + selected.s1 + '</div></div>' +
          '<div class="c"><div class="l">投诉中</div><div class="n">' + selected.s2 + '</div></div></div></div>' +
        '<div class="sr-sec"><h4>Listing（Top 5）</h4><table class="sr-mini"><thead><tr><th>风控编号</th><th>标题</th><th>类型</th></tr></thead><tbody>' +
        (topL || '<tr><td colspan="3" style="color:#909399">无</td></tr>') + '</tbody></table></div>' +
        '<div class="sr-sec"><h4>涉及 SKU 数（Top 5）</h4><table class="sr-mini"><thead><tr><th>SKU</th><th>关联 Listing 数</th></tr></thead><tbody>' +
        (topS || '<tr><td colspan="2" style="color:#909399">无</td></tr>') + '</tbody></table></div>' +
        '<div class="sr-sec"><h4>风险命中数</h4><div style="font-size:13px;color:#606266;line-height:1.8">商标 ' + selected.tm + ' · 版权 ' + selected.cp + ' · 外观 ' + selected.dp + ' · 低价 Listing ' + selected.low + '</div></div>' +
        '</div>' +
        '<div class="sr-ft">' +
          '<button class="el-button el-button--primary el-button--small" data-act="srToList" data-sname="' + srEsc(selected.seller) + '" data-splatform="' + srEsc(selected.platform) + '" data-ssite="' + srEsc(selected.site) + '">去列表处理</button>' +
        '</div></aside>';
    }
    return '<div class="sr-wrap"><div class="sr-search search-space">' +
      '<input class="el-input" id="srSeller" style="width:180px" placeholder="卖家名称" value="' + srEsc(state.srSeller) + '">' +
      '<select class="el-select" id="srSite" style="width:110px"><option value="">站点</option>' +
      sites.map(function (s) { return '<option value="' + srEsc(s) + '"' + (state.srSite===s?' selected':'') + '>' + srEsc(s) + '</option>'; }).join('') + '</select>' +
      '<select class="el-select" id="srPlatform" style="width:140px"><option value="">平台</option>' +
      plats.map(function (s) { return '<option value="' + srEsc(s) + '"' + (state.srPlatform===s?' selected':'') + '>' + srEsc(s) + '</option>'; }).join('') + '</select>' +
      '<span style="font-size:13px;color:#606266;white-space:nowrap">更新时间</span>' +
      '<input class="el-input" id="srFrom" type="date" style="width:140px" value="' + srEsc(state.srFrom) + '">' +
      '<span style="color:#c0c4cc">-</span>' +
      '<input class="el-input" id="srTo" type="date" style="width:140px" value="' + srEsc(state.srTo) + '">' +
      '<button class="el-button el-button--primary" data-act="srSearch">查询</button>' +
      '<button class="el-button" data-act="srReset">重置</button></div>' +
      '<div class="sr-kpi">' +
        '<div class="sr-card"><div class="t">活跃风险卖家数</div><div class="v">' + sellerCnt + '</div></div>' +
        '<div class="sr-card"><div class="t">活跃风险 Listing 数</div><div class="v">' + activeN + '</div></div>' +
        '<div class="sr-card"><div class="t">涉及 SKU 数</div><div class="v">' + Object.keys(skuMap).length + '</div></div>' +
        '<div class="sr-card"><div class="t">低价风险 Listing 数</div><div class="v">' + lowN + '</div></div>' +
      '</div>' +
      '<div class="sr-table-wrap"><table class="sr-table"><thead><tr>' +
        '<th>卖家名称</th><th>站点</th><th>平台</th>' +
        sortTh('active','活跃风险 Listing 数') + sortTh('skuCnt','涉及 SKU 数') +
        sortTh('low','低价风险 Listing 数') + sortTh('hitCnt','风险命中数') +
        sortTh('latest','更新时间') +
        '<th>操作</th></tr></thead><tbody>' +
        (body || '<tr><td colspan="9" style="text-align:center;padding:32px;color:#909399">无匹配卖家</td></tr>') +
      '</tbody></table></div>' +
      '<div class="sr-pager">共 ' + total + ' 个卖家' +
        '<button class="el-button el-button--small" data-act="srPrev"' + (state.srPage<=1?' disabled':'') + '>上一页</button>' +
        '<span>' + state.srPage + ' / ' + maxPage + '</span>' +
        '<button class="el-button el-button--small" data-act="srNext"' + (state.srPage>=maxPage?' disabled':'') + '>下一页</button></div></div>' +
      drawer;
  }

  function setHeader(title) { document.getElementById('headerTitle').textContent = title; }

  function render() {
    var topPages = { listing: 1, detail: 1, complaint: 1, check: 1 };
    document.querySelectorAll('.menu-item').forEach(function (el) {
      var nav = el.getAttribute('data-nav');
      var active = false;
      if (nav === 'listing') active = !!topPages[state.page];
      else if (nav === 'sellerRisk') active = state.page === 'sellerRisk';
      else if (nav === 'patent') active = state.page === 'patent';
      el.classList.toggle('active', active);
    });
    var main = document.getElementById('main');
    main.classList.toggle('is-board', state.page === 'sellerRisk');
    if (state.page === 'listing') { setHeader('Listing侵权风控'); main.innerHTML = pageListing(); }
    else if (state.page === 'detail') { setHeader(state.detailType===1?'提交确认':'查看详情'); main.innerHTML = pageDetail(); }
    else if (state.page === 'complaint') { setHeader('提交投诉'); main.innerHTML = pageComplaint(); }
    else if (state.page === 'check') { setHeader('查看投诉'); main.innerHTML = pageCheck(); }
    else if (state.page === 'sellerRisk') { setHeader('卖家风险看板'); main.innerHTML = pageSellerRisk(); }
    else if (state.page === 'patent') { setHeader('外观专利管理'); main.innerHTML = pagePatent(); }
    document.querySelectorAll('.el-select').forEach(function (sel) {
      sel.classList.toggle('has-val', !!sel.value);
      sel.addEventListener('change', function () { sel.classList.toggle('has-val', !!sel.value); });
    });
    var patentSel = document.getElementById('patentStatusSel');
    if (patentSel) {
      patentSel.onchange = function () {
        state.patentStatusFilter = patentSel.value || '';
        render();
      };
    }
  }

  function complaintModeOf(p) {
    if (isEmailComplaint(p)) return 'email';
    if (isPortalComplaint(p)) return 'portal';
    return '';
  }

  document.querySelector('.layout-menu').addEventListener('click', function (e) {
    var item = e.target.closest('.menu-item');
    if (!item) return;
    var nav = item.getAttribute('data-nav');
    if (nav === 'listing') {
      state.listSite = '';
      state.listPlatform = '';
      state.listSeller = '';
    }
    state.page = nav;
    render();
  });

  document.getElementById('main').addEventListener('click', function (e) {
    var t = e.target.closest('[data-act],[data-batch],[data-seller],#checkAll');
    if (!t) return;
    if (t.id === 'checkAll') {
      document.querySelectorAll('[data-check]').forEach(function (c) { c.checked = t.checked; });
      return;
    }
    var act = t.getAttribute('data-act');
    var batch = t.getAttribute('data-batch');
    var sellerAct = t.getAttribute('data-seller');
    var id = Number(t.getAttribute('data-id'));

    if (act === 'search') {
      var ls = document.getElementById('listSite');
      var lp = document.getElementById('listPlatform');
      var ln = document.getElementById('listSeller');
      if (ls) state.listSite = ls.value;
      if (lp) state.listPlatform = lp.value;
      if (ln) state.listSeller = ln.value.trim();
      render();
      return;
    }
    if (act === 'srSearch') { readSrFilters(); state.srPage = 1; render(); return; }
    if (act === 'srReset') {
      state.srSite = ''; state.srPlatform = ''; state.srSeller = ''; state.srFrom = ''; state.srTo = '';
      state.srSortKey = 'active'; state.srSortDir = 'desc'; state.srPage = 1; state.srDrawer = false; state.srKey = '';
      render(); return;
    }
    if (act === 'srSort') {
      var sk = t.getAttribute('data-key');
      if (state.srSortKey === sk) state.srSortDir = state.srSortDir === 'desc' ? 'asc' : 'desc';
      else { state.srSortKey = sk; state.srSortDir = 'desc'; }
      state.srPage = 1; render(); return;
    }
    if (act === 'srOpen') { state.srKey = t.getAttribute('data-key'); state.srDrawer = true; render(); return; }
    if (act === 'srClose') { state.srDrawer = false; state.srKey = ''; render(); return; }
    if (act === 'srPrev') { if (state.srPage > 1) { state.srPage--; render(); } return; }
    if (act === 'srNext') { state.srPage++; render(); return; }
    if (act === 'srToList') {
      var u = new URL(location.href);
      u.searchParams.set('page', 'listing');
      u.searchParams.set('seller', t.getAttribute('data-sname') || '');
      u.searchParams.set('site', t.getAttribute('data-ssite') || '');
      u.searchParams.set('platform', t.getAttribute('data-splatform') || '');
      window.open(u.toString(), '_blank', 'noopener');
      return;
    }
    if (act === 'patentAdd') { openPatentDialog('add'); return; }
    if (act === 'patentImport') { toast('请选择导入文件'); return; }
    if (act === 'patentPause') {
      var pp = findPatent(id);
      if (!pp) return;
      confirmBox('确认暂停检索？暂停后将不再纳入 Amazon 外观专利检索。再次检索请点启用检索。', function () {
        pp.status = 'paused';
        toast('已暂停检索');
        render();
      });
      return;
    }
    if (act === 'patentEnable') {
      var pe = findPatent(id);
      if (!pe) return;
      if (!patentCanEnable(pe)) { toast('请先补全专利号/申请号与至少 1 张检索参考图', true); return; }
      confirmBox('确认启用检索？启用后将纳入 Amazon 外观专利检索。', function () {
        pe.status = 'ready';
        toast('已启用检索');
        render();
      });
      return;
    }
    if (act === 'patentEdit') {
      var ep = findPatent(id);
      if (ep) openPatentDialog('edit', ep);
      return;
    }
    if (act === 'patentDelete') {
      confirmBox('确定删除该外观专利记录吗？', function () {
        patents = patents.filter(function (x) { return x.id !== id; });
        toast('已删除（原型）');
        render();
      });
      return;
    }
    if (act === 'previewPatentImg') {
      openPatentPreview(t.getAttribute('data-src'));
      return;
    }
    if (act === 'back') { state.page = 'listing'; state.batchIds = []; render(); return; }
    if (act === 'confirm') { state.detailId = id; state.detailType = 1; state.oppImgIdx = 0; state.patentImgIdx = 0; state.page = 'detail'; render(); return; }
    if (act === 'detail') { state.detailId = id; state.detailType = 0; state.oppImgIdx = 0; state.patentImgIdx = 0; state.page = 'detail'; render(); return; }
    if (act === 'pickOppImg') {
      state.oppImgIdx = Number(t.getAttribute('data-idx')) || 0;
      render();
      return;
    }
    if (act === 'pickPatentImg') {
      state.patentImgIdx = Number(t.getAttribute('data-idx')) || 0;
      render();
      return;
    }
    if (act === 'complaint') {
      var c = findListing(id);
      if (!c || !canSystemComplaint(c.platform)) { toast('该平台不支持系统内投诉', true); return; }
      state.complaintId = id; state.complaintMode = complaintModeOf(c.platform); state.page = 'complaint'; render(); return;
    }
    if (act === 'check') { state.complaintId = id; state.page = 'check'; render(); return; }
    if (act === 'close') {
      closeReasonBox('关闭此单', function (reason, remark) {
        applyClose([id], reason, remark);
        toast('操作成功'); state.page = 'listing'; render();
      });
      return;
    }
    if (act === 'doConfirm') {
      confirmBox('确定操作所选数据吗？', function () {
        var r = findListing(id); if (r && r.status === 0) { r.status = 1; r.cfTime = '2026-07-23 12:00:00'; r.cfUser = '当前用户'; }
        toast('操作成功'); state.page = 'listing'; render();
      });
      return;
    }
    if (act === 'evidenceReport') {
      toast('报告下载（原型演示）');
      return;
    }
    if (act === 'evidence' || act === 'evidenceRetry') {
      var er = findListing(id);
      if (!er) return;
      if (!canClickEvidence(er)) { toast('当前状态不可存证', true); return; }
      if (hasPendingEvidence(er)) { toast('已有存证中任务，请勿重复提交', true); return; }
      confirmBox('确认为该 Listing 发起存证？', function () {
        startEvidence(er);
        toast(act === 'evidenceRetry' ? '已重新发起存证' : '已发起存证');
        render();
      });
      return;
    }
    if (act === 'submitComplaint') {
      confirmBox('确定操作所选数据吗？', function () {
        var r = findListing(id); if (r) { r.status = 2; r.sTime = '2026-07-23 12:05:00'; r.sUser = '当前用户'; }
        toast('操作成功'); state.page = 'listing'; render();
      });
      return;
    }
    if (act === 'success' || act === 'reject' || act === 'fixStart' || act === 'fixDone') {
      var row = findListing(id);
      if (!row) return;
      if ((act === 'success' || act === 'reject') && row.status !== 1 && row.status !== 2) {
        toast('仅待投诉或投诉中可标记结果', true);
        return;
      }
      if ((act === 'fixStart' || act === 'fixDone') && row.status !== 2) {
        toast('仅投诉中可订正', true);
        return;
      }
      confirmBox('确定操作所选数据吗？', function () {
        var r = findListing(id); if (!r) return;
        if (act === 'success') r.status = 3;
        if (act === 'reject') r.status = 4;
        if (act === 'fixStart') r.fixed = 1;
        if (act === 'fixDone') r.fixed = 2;
        toast('操作成功'); render();
      });
      return;
    }
    if (batch) {
      var ids = Array.prototype.slice.call(document.querySelectorAll('[data-check]:checked')).map(function (c) { return Number(c.getAttribute('data-check')); });
      if (!ids.length) { toast('请选择对应行', true); return; }
      if (batch === 'close') {
        var closeRows = selectedListings(ids);
        for (var ci = 0; ci < closeRows.length; ci++) {
          if (closeRows[ci].status !== 0 && closeRows[ci].status !== 1) {
            toast('仅待确认或待投诉可关闭', true);
            return;
          }
        }
        closeReasonBox('批量关闭', function (reason, remark) {
          applyClose(ids, reason, remark);
          toast('操作成功'); render();
        });
        return;
      }
      if (batch === 'success' || batch === 'reject') {
        var resultErr = validateBatchResult(ids);
        if (resultErr) { toast(resultErr, true); return; }
      }
      if (batch === 'fixStart' || batch === 'fixDone') {
        var fixRows = selectedListings(ids);
        for (var fi = 0; fi < fixRows.length; fi++) {
          if (fixRows[fi].status !== 2) { toast('请选择投诉中状态的数据', true); return; }
          if (batch === 'fixDone' && fixRows[fi].fixed !== 1) { toast('请选择已启动订正的数据', true); return; }
        }
      }
      confirmBox('确定操作所选数据吗？', function () {
        ids.forEach(function (cid) {
          var r = findListing(cid); if (!r) return;
          if (batch === 'success' && (r.status === 1 || r.status === 2)) r.status = 3;
          if (batch === 'reject' && (r.status === 1 || r.status === 2)) r.status = 4;
          if (batch === 'fixStart' && r.status === 2) r.fixed = 1;
          if (batch === 'fixDone' && r.status === 2 && r.fixed === 1) r.fixed = 2;
        });
        toast('操作成功'); render();
      });
      return;
    }
    if (sellerAct) {
      var s = sellers.find(function (x) { return x.id === id; });
      if (!s) return;
      confirmBox('确认要将卖家' + s.name + '执行' + (sellerAct==='on'?'启用':'取消') + '授权操作吗?', function () {
        s.status = sellerAct==='on'?1:0;
        toast('操作成功'); render();
      });
    }
  });

  render();
})();
</script>
</body>
</html>
